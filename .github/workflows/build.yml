name: Build experimental Rukcord rootless package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test payload
        working-directory: rukcord
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          node scripts/build.mjs --release-branch main --build-minify
          npm test
      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1
      - name: Package rootless loader
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          mkdir -p RukcordNative/Resources
          cp rukcord/dist/rukcord.min.js RukcordNative/Resources/rukcord.js
          make -C RukcordNative package
      - uses: actions/upload-artifact@v4
        with:
          name: rukcord-0.6.1a-rootless
          path: RukcordNative/packages/*_iphoneos-arm64.deb
          if-no-files-found: error
